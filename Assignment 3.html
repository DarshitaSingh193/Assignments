<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and Inline Elements</title>
    <style>.block-element{background-color:#add8e6; margin: bottom 5px; padding:2px}
        .inline-element{background-color:#90ee90; padding:2px} 
    </style>
</head>
<body>
    <div class="block-element">Block 1</div>
    <br><div class="block-element">Block 2</div>
    <br><span class="inline-element">Inline 1</span>
    <span class="inline-element">Inline 2</span>
    <span class="inline-element">Inline 3</span>
    
</body>
</html>
